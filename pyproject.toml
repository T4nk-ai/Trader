[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trader"
version = "0.1.0"
description = "Private trading bot: Phase 1 backtester"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2",
  "numpy>=2.4.6",
  "yfinance>=0.2.40",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["trader"]

[tool.pytest.ini_options]
testpaths = ["tests"]
